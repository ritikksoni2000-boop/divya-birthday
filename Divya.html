<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Divya ❤️</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#020004;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}


/* =========================
   MAIN SCENE
========================= */

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 45%,
        #5b0875 0%,
        #270031 35%,
        #0b0012 70%,
        #020003 100%
    );
}


/* Background glow */

.scene::before{
    content:"";
    position:absolute;

    width:70vw;
    height:70vw;

    max-width:850px;
    max-height:850px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(
        circle,
        rgba(255,20,147,.25),
        transparent 65%
    );

    filter:blur(35px);

    animation:bgGlow 5s ease-in-out infinite alternate;
}


/* =========================
   CINEMATIC BLACK BARS
========================= */

.cinematic-bars{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:1000;
}

.cinematic-bars::before,
.cinematic-bars::after{
    content:"";

    position:absolute;
    left:0;
    width:100%;
    height:7vh;

    background:#000;
}

.cinematic-bars::before{
    top:0;
}

.cinematic-bars::after{
    bottom:0;
}


/* =========================
   START SCREEN
========================= */

.startScreen{
    position:fixed;
    inset:0;

    z-index:500;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    text-align:center;

    background:
    radial-gradient(
        circle at center,
        #4b075f,
        #140019 55%,
        #020003
    );

    transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

.startScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}


/* Start small text */

.startSmall{
    font-size:14px;
    letter-spacing:7px;

    margin-bottom:25px;

    color:#ffd8f1;

    animation:
    startSmall 2s infinite alternate;
}


/* Start title */

.startTitle{

    font-size:
    clamp(35px,8vw,80px);

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        white,
        #ff72c8,
        white,
        #ff1493,
        white
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
    gradient 4s linear infinite;

}


/* Start button */

.startButton{

    margin-top:40px;

    padding:18px 45px;

    border:none;

    border-radius:50px;

    cursor:pointer;

    color:white;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;

    background:
    linear-gradient(
        135deg,
        #ff1493,
        #8a2be2
    );

    box-shadow:
    0 0 20px #ff1493,
    0 0 50px rgba(255,20,147,.5);

    animation:
    buttonPulse 1.5s infinite;

    transition:.3s;
}

.startButton:hover{
    transform:scale(1.08);
}


/* =========================
   STARS
========================= */

.stars{
    position:absolute;
    inset:0;

    z-index:2;
}

.star{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px white,
    0 0 20px white;

    animation:
    twinkle 2s infinite alternate;
}

.star:nth-child(1){left:8%;top:18%;}
.star:nth-child(2){left:18%;top:65%;animation-delay:.4s;}
.star:nth-child(3){left:30%;top:23%;animation-delay:.9s;}
.star:nth-child(4){left:42%;top:12%;animation-delay:.2s;}
.star:nth-child(5){left:55%;top:30%;animation-delay:1s;}
.star:nth-child(6){left:67%;top:15%;animation-delay:.5s;}
.star:nth-child(7){left:78%;top:35%;animation-delay:1.2s;}
.star:nth-child(8){left:90%;top:18%;animation-delay:.7s;}
.star:nth-child(9){left:92%;top:70%;animation-delay:.3s;}
.star:nth-child(10){left:47%;top:82%;animation-delay:1.1s;}
.star:nth-child(11){left:12%;top:42%;animation-delay:.8s;}
.star:nth-child(12){left:72%;top:78%;animation-delay:.1s;}


/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;

    overflow:hidden;

    z-index:3;
}

.particle{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#ff72c8;

    box-shadow:
    0 0 10px #ff72c8;

    bottom:-20px;

    animation:
    particleUp 7s linear infinite;
}

.particle:nth-child(1){left:5%;animation-delay:0s;}
.particle:nth-child(2){left:15%;animation-delay:2s;}
.particle:nth-child(3){left:25%;animation-delay:4s;}
.particle:nth-child(4){left:35%;animation-delay:1s;}
.particle:nth-child(5){left:45%;animation-delay:3s;}
.particle:nth-child(6){left:55%;animation-delay:5s;}
.particle:nth-child(7){left:65%;animation-delay:2s;}
.particle:nth-child(8){left:75%;animation-delay:4s;}
.particle:nth-child(9){left:85%;animation-delay:1s;}
.particle:nth-child(10){left:95%;animation-delay:3s;}


/* =========================
   SLIDES
========================= */

.slide{

    position:absolute;
    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    opacity:0;

    z-index:10;

    pointer-events:none;
}


/* =========================
   INTRO
========================= */

.slide1{
    animation:
    sceneOne 5s 0s forwards;
}

.intro{

    font-size:
    clamp(12px,2vw,20px);

    letter-spacing:9px;

    opacity:0;

    text-shadow:
    0 0 15px white;

    animation:
    introReveal 3s 1s forwards;
}

.mainTitle{

    margin-top:25px;

    font-size:
    clamp(45px,9vw,110px);

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        white,
        #ff72c8,
        white,
        #ff1493,
        white
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    opacity:0;

    transform:scale(.5);

    filter:blur(20px);

    animation:
    titleReveal 3s 1.5s forwards,
    gradient 5s infinite linear;
}


/* =========================
   PHOTO SCENE
========================= */

.slide2{
    animation:
    sceneTwo 7s 4s forwards;
}


.photoFrame{

    position:relative;

    width:min(330px,72vw);

    height:min(430px,63vh);

    padding:7px;

    border-radius:25px;

    background:
    linear-gradient(
        135deg,
        white,
        #ff1493,
        #8a2be2,
        white
    );

    background-size:300%;

    box-shadow:
    0 0 20px white,
    0 0 45px #ff1493,
    0 0 100px #8a2be2;

    opacity:0;

    transform:
    scale(.5)
    rotate(-8deg);

    animation:
    photoReveal 4s 4.5s forwards,
    frameGlow 5s linear infinite;
}


.photoInner{

    width:100%;
    height:100%;

    overflow:hidden;

    border-radius:19px;

    position:relative;

    background:#050505;
}


/*
   FULL PHOTO
   NO CROPPING
*/

.photoInner img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    background:#050505;

    animation:
    cinematicZoom 9s 5s forwards;
}


/* Dark cinematic overlay */

.photoInner::before{

    content:"";

    position:absolute;
    inset:0;

    z-index:2;

    background:
    linear-gradient(
        180deg,
        rgba(0,0,0,.35),
        transparent 25%,
        transparent 70%,
        rgba(0,0,0,.45)
    );

    pointer-events:none;
}


/* Light sweep */

.photoInner::after{

    content:"";

    position:absolute;

    top:-20%;
    left:-100%;

    width:50%;
    height:140%;

    z-index:3;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
    );

    transform:skewX(-20deg);

    animation:
    lightSweep 4s 6s forwards;
}


/* Divya name */

.divyaName{

    margin-top:25px;

    font-size:
    clamp(40px,8vw,85px);

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
    0 0 10px #ff1493,
    0 0 30px #ff1493,
    0 0 70px #ff1493,
    0 0 120px #ff1493;

    opacity:0;

    transform:
    translateY(40px)
    scale(.7);

    animation:
    divyaReveal 3s 6s forwards;
}


/* Heart */

.heart{

    margin-top:18px;

    font-size:40px;

    opacity:0;

    animation:
    heartReveal 2s 7s forwards,
    heartbeat 1.2s 9s infinite;
}


/* =========================
   CAKE SCENE
========================= */

.slide3{
    animation:
    sceneThree 7s 10s forwards;
}


/* Balloons */

.balloon{

    position:absolute;

    width:65px;
    height:82px;

    bottom:-150px;

    border-radius:50%;

    opacity:0;

    box-shadow:
    inset -10px -10px 15px rgba(0,0,0,.15),
    0 0 20px rgba(255,255,255,.2);

    animation:
    balloonRise 7s 10s forwards;
}

.balloon::after{

    content:"";

    position:absolute;

    width:2px;
    height:190px;

    left:50%;
    top:80px;

    background:
    rgba(255,255,255,.45);
}

.b1{
    left:8%;
    background:#ff1680;
}

.b2{
    left:27%;
    background:#754cff;
    animation-delay:10.5s;
}

.b3{
    right:27%;
    background:#00dfff;
    animation-delay:11s;
}

.b4{
    right:8%;
    background:#ffd000;
    animation-delay:10.3s;
}


/* Cake */

.cake{

    position:relative;

    width:240px;
    height:180px;

    opacity:0;

    transform:
    translateY(100px)
    scale(.5);

    animation:
    cakeReveal 5s 11s forwards;
}

.cakeBody{

    position:absolute;

    left:20px;
    bottom:15px;

    width:200px;
    height:85px;

    border-radius:
    15px 15px 25px 25px;

    background:
    linear-gradient(
        #ff86d1,
        #ff1493
    );

    box-shadow:
    0 0 35px #ff1493;
}

.cakeIcing{

    position:absolute;

    left:20px;
    top:68px;

    width:200px;
    height:35px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px white;
}


/* Candles */

.candle{

    position:absolute;

    top:15px;

    width:16px;
    height:58px;

    border-radius:5px;

    background:
    repeating-linear-gradient(
        45deg,
        white,
        white 6px,
        #ff72c8 6px,
        #ff72c8 10px
    );

    z-index:5;
}

.candle:nth-child(1){
    left:72px;
}

.candle:nth-child(2){
    left:112px;
}

.candle:nth-child(3){
    left:152px;
}


/* Flame */

.flame{

    position:absolute;

    width:20px;
    height:28px;

    top:-27px;
    left:-2px;

    background:#ffd000;

    border-radius:
    50% 50% 50% 0;

    transform:rotate(-45deg);

    box-shadow:
    0 0 15px #ff9800,
    0 0 35px #ff9800,
    0 0 60px #ffd000;

    animation:
    flame 0.5s infinite alternate;
}


/* =========================
   FINAL SCENE
========================= */

.slide4{

    animation:
    sceneFour 20s 16s forwards;
}


.finalPhoto{

    width:min(210px,48vw);
    height:min(210px,48vw);

    padding:5px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        white,
        #ff1493,
        #8a2be2,
        white
    );

    box-shadow:
    0 0 20px white,
    0 0 50px #ff1493,
    0 0 100px #8a2be2;

    opacity:0;

    transform:
    scale(.2)
    rotate(-30deg);

    animation:
    finalPhoto 4s 17s forwards;
}


.finalPhotoInner{

    width:100%;
    height:100%;

    border-radius:50%;

    overflow:hidden;

    background:#050505;
}


/* FULL PHOTO */

.finalPhoto img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    background:#050505;
}


.finalTitle{

    margin-top:25px;

    padding:0 15px;

    font-size:
    clamp(35px,7vw,80px);

    font-weight:bold;

    background:
    linear-gradient(
        90deg,
        white,
        #ff72c8,
        white,
        #ff1493,
        white
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    opacity:0;

    transform:scale(.5);

    animation:
    finalTitle 4s 18s forwards,
    gradient 5s infinite linear;
}


.message{

    max-width:750px;

    padding:0 25px;

    margin-top:18px;

    font-size:
    clamp(16px,2.5vw,23px);

    line-height:1.7;

    opacity:0;

    transform:translateY(30px);

    animation:
    message 4s 19s forwards;
}


/* =========================
   MUSIC BUTTON
========================= */

.musicButton{

    position:fixed;

    right:25px;
    bottom:25px;

    z-index:2000;

    width:55px;
    height:55px;

    border:none;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #ff1493,
        #8a2be2
    );

    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
    0 0 15px #ff1493,
    0 0 30px rgba(255,20,147,.5);

    display:none;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes bgGlow{

    from{
        opacity:.5;
        transform:
        translate(-50%,-50%)
        scale(.9);
    }

    to{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(1.2);
    }
}

@keyframes twinkle{

    from{
        opacity:.2;
        transform:scale(.5);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}

@keyframes particleUp{

    0%{
        transform:
        translateY(0)
        scale(.5);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
        translateY(-110vh)
        scale(1.5);

        opacity:0;
    }
}


/* Start */

@keyframes startSmall{

    from{
        opacity:.4;
    }

    to{
        opacity:1;
    }
}

@keyframes buttonPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }
}


/* Intro */

@keyframes introReveal{

    from{
        opacity:0;
        letter-spacing:25px;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        letter-spacing:9px;
        transform:translateY(0);
    }
}

@keyframes titleReveal{

    0%{
        opacity:0;
        transform:scale(.4);
        filter:blur(20px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes gradient{

    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }
}


/* Scenes */

@keyframes sceneOne{

    0%{
        opacity:1;
        transform:scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(1.15);
    }
}

@keyframes sceneTwo{

    0%{
        opacity:0;
        transform:scale(1.15);
    }

    15%{
        opacity:1;
        transform:scale(1);
    }

    82%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(.92);
    }
}

@keyframes sceneThree{

    0%{
        opacity:0;
        transform:scale(1.15);
    }

    15%{
        opacity:1;
        transform:scale(1);
    }

    82%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}

@keyframes sceneFour{

    0%{
        opacity:0;
        transform:scale(1.1);
    }

    10%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:1;
    }
}


/* Photo */

@keyframes photoReveal{

    0%{
        opacity:0;
        transform:
        scale(.5)
        rotate(-8deg);

        filter:blur(15px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:
        scale(1)
        rotate(0);

        filter:blur(0);
    }
}

@keyframes cinematicZoom{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.08);
    }
}

@keyframes frameGlow{

    from{
        background-position:0%;
    }

    to{
        background-position:300%;
    }
}

@keyframes lightSweep{

    0%{
        left:-100%;
    }

    100%{
        left:150%;
    }
}


/* Name */

@keyframes divyaReveal{

    0%{
        opacity:0;
        transform:
        translateY(40px)
        scale(.7);

        filter:blur(15px);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;
        transform:
        translateY(0)
        scale(1);

        filter:blur(0);
    }
}

@keyframes heartReveal{

    from{
        opacity:0;
        transform:scale(0);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.25);
    }
}


/* Balloons */

@keyframes balloonRise{

    0%{
        bottom:-150px;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        bottom:110%;
        opacity:1;

        transform:
        rotate(10deg)
        translateX(30px);
    }
}


/* Cake */

@keyframes cakeReveal{

    0%{
        opacity:0;

        transform:
        translateY(100px)
        scale(.5);
    }

    60%{
        opacity:1;

        transform:
        translateY(-15px)
        scale(1.1);
    }

    100%{
        opacity:1;

        transform:
        translateY(0)
        scale(1);
    }
}

@keyframes flame{

    from{
        transform:
        rotate(-45deg)
        scale(1);
    }

    to{
        transform:
        rotate(-45deg)
        scale(1.2);
    }
}


/* Final */

@keyframes finalPhoto{

    0%{
        opacity:0;

        transform:
        scale(.2)
        rotate(-30deg);

        filter:blur(20px);
    }

    70%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
        scale(1)
        rotate(0);

        filter:blur(0);
    }
}

@keyframes finalTitle{

    from{
        opacity:0;
        transform:scale(.5);
        filter:blur(15px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

@keyframes message{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .cinematic-bars::before,
    .cinematic-bars::after{
        height:5vh;
    }

    .startSmall{
        font-size:11px;
        letter-spacing:5px;
    }

    .startButton{
        padding:16px 35px;
        font-size:16px;
    }

    .mainTitle{
        font-size:48px;
        line-height:1.1;
        padding:0 15px;
    }

    .photoFrame{
        width:75vw;
        height:55vh;
        max-height:420px;
    }

    .divyaName{
        font-size:45px;
    }

    .balloon{
        width:45px;
        height:60px;
    }

    .cake{
        transform:scale(.8);
    }

    .finalPhoto{
        width:170px;
        height:170px;
    }

    .finalTitle{
        font-size:38px;
    }

    .message{
        font-size:16px;
        line-height:1.5;
    }

    .musicButton{
        width:48px;
        height:48px;

        right:15px;
        bottom:15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     START SCREEN
====================================================== -->

<div class="startScreen" id="startScreen">

    <div class="startSmall">
        ✨ A SPECIAL SURPRISE FOR YOU ✨
    </div>

    <div class="startTitle">
        DIVYA ❤️
    </div>

    <button
        class="startButton"
        onclick="startBirthday()"
    >
        ▶ START 🎵
    </button>

</div>


<!-- =====================================================
     MAIN SCENE
====================================================== -->

<div class="scene" id="scene">


    <!-- STARS -->

    <div class="stars">

        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>

    </div>


    <!-- PARTICLES -->

    <div class="particles">

<script>

/* =====================================================
   START BIRTHDAY
===================================================== */

function startBirthday(){

    const startScreen =
        document.getElementById("startScreen");

    const song =
        document.getElementById("birthdaySong");

    const musicButton =
        document.getElementById("musicButton");


    /*
       Start music immediately after
       user click.
    */

    song.volume = 0.85;


    song.play()
    .then(() => {

        musicButton.style.display = "block";

    })
    .catch((error) => {

        console.log(
            "Audio could not start:",
            error
        );

        musicButton.style.display = "block";

    });


    /*
       Hide start screen
    */

    startScreen.classList.add("hide");

}


/* =====================================================
   MUSIC TOGGLE
===================================================== */

function toggleMusic(){

    const song =
        document.getElementById("birthdaySong");

    const button =
        document.getElementById("musicButton");


    if(song.paused){

        song.play();

        button.innerHTML = "🔊";

    }
    else{

        song.pause();

        button.innerHTML = "🔇";

    }

}

</script>
